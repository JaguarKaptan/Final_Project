{%extends "base.html"%}
{%block title%} Recover Page {%endblock%}

{%block content%}

<div class="container-fluid bg-dark vh-100">
    <div class="container">
        <div class="row vh-100 align-items-center justify-content-center">
            <div class="col-sm-8 col-md-6 col-lg-4 bg-secondary rounded-5 p-4 shadow text-light">
                <h1 class="text-center">Recover Account</h1>

                <form action="{{url_for('change_password')}}" method='POST'>
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <input type="hidden" name="auth" value="{{ auth }}">

                    <div class="mb-4">
                        <label for="password" class="form-label">New Password:
                            <i class="bi bi-info-circle ms-1 text-info" style="cursor: pointer;" data-bs-toggle="tooltip"
                                data-bs-custom-class="custom-tooltip" data-bs-placement="top"
                                title="Password must be 8-64 characters and can contain letters, numbers, and special characters. Use a mix of letters and numbers."></i>
                        </label>
                        <input type="password" class="form-control" id="password" placeholder="New Password" name="password"
                            required>
                        <i class="bi bi-eye-slash text-light fs-5 password-toggle"></i>
                    </div>

                    <div class="mb-4">
                        <label for="password-confirm" class="form-label">New Password Confirmation:</label>
                        <input type="password" class="form-control" id="password-confirm" placeholder="New Password Again"
                            name="password-confirm" required>
                    </div>

                    <input class="btn btn-primary w-100 mb-3" type="submit" value="Change Password">
                </form>

            </div>
        </div>
    </div>
</div>


{%endblock%}

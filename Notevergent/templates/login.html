{%extends "base.html"%}
{%block title%} Login Page {%endblock%}

{%block content%}



<div class="container-fluid bg-dark vh-100">
        <div class="container">
            <div class="row vh-100 align-items-center justify-content-center">
                <div class="col-11 col-sm-9 col-md-7 col-lg-5 col-xl-4 bg-secondary rounded-5 p-4 shadow text-light">
                    <h1 class="text-center">Login</h1>

                    <form action="{{url_for('login')}}" method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-4">
                            <label for="username" class="form-label">Username:</label>
                            <input type="text" class="form-control" id="username" placeholder="Username" name="username" autocomplete="off">
                        </div>
                        
                        <div class="mb-4">
                            <label for="password" class="form-label">Password:</label>
                            <input type="password" class="form-control" id="password" placeholder="Password" name="password">
                            <i class="bi bi-eye-slash text-light fs-5 password-toggle"></i>
                        </div>
                        
                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="remember" name="remember"> Remember Me

                        </div>
                        

                        <input class="btn btn-primary w-100 mb-3" type="submit" value="Login">

                        <div class="d-md-flex justify-content-between gap-2">
                            <a class="btn btn-success w-100 text-nowrap mb-2 mb-md-0" href="{{url_for('account_recovery')}}">Forgot Password?</a>
                            <a class="btn btn-success w-100 text-nowrap" href="{{url_for('signup')}}">Signup</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
</div>

{%endblock%}

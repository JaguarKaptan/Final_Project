<!-- AI (Chatgpt) assisted: To create mail template and make it visible in all clients -->
<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>{{ subject }}</title>
</head>

<body style="margin:0; padding:0; background-color:#0a0e27; font-family: Arial, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#0a0e27; padding: 50px 0;">
    <tr>
      <td align="center">
        <!-- Main container -->
        <table width="600" cellpadding="0" cellspacing="0" border="0"
          style="background-color:#12172e; border-radius:20px; border:1px solid #1f2640; box-shadow:0 8px 25px rgba(0,0,0,0.4);">
          <!-- Title -->
          <tr>
            <td align="center" style="padding: 30px;">
              <div style="background-color:#1a2038; border-radius:12px; padding:20px;">
                <h2 style="color:#4fc3f7; margin:0;">{{ title }}</h2>
              </div>
            </td>
          </tr>

          <!-- Message -->
          <tr>
            <td align="center" style="padding: 0 30px 20px 30px;">
              <div
                style="background-color:#1a2038; border-radius:12px; padding:20px; color:#e1e8f0; font-size:16px; line-height:1.6;">
                {{ message }}
              </div>
            </td>
          </tr>

          <!-- Button -->
          <tr>
            <td align="center" style="padding: 0 30px 20px 30px;">
              <div
                style="background-color:#1a2038; border-radius:12px; padding:20px; color:#e1e8f0; font-size:16px; line-height:1.6;">
                  <a href="{{ verify_url }}"
                    style="background-color:#4fc3f7; color:#12172e; text-decoration:none; padding:12px 25px; border-radius:12px; font-weight:bold; display:inline-block;">
                    {{ action }}
                  </a>
              </div>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding: 20px; font-size:12px; color:#8b92a8; border-top:1px solid #1f2640;">
              This email was sent by Notevergent. If you did not request this, you can safely ignore it.
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>

</html>
